<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <text x="450" y="35" text-anchor="middle" font-size="20" font-family="Arial">Reconnection flow</text>
  <rect x="80" y="70" width="220" height="50" fill="#fee2e2" stroke="#dc2626" />
  <text x="190" y="100" text-anchor="middle" font-size="13" font-family="Arial">Socket lost</text>
  <rect x="350" y="70" width="220" height="50" fill="#fef3c7" stroke="#ca8a04" />
  <text x="460" y="100" text-anchor="middle" font-size="13" font-family="Arial">Backoff and reconnect</text>
  <rect x="620" y="70" width="200" height="50" fill="#dcfce7" stroke="#16a34a" />
  <text x="720" y="100" text-anchor="middle" font-size="13" font-family="Arial">reconnect_ok</text>
  <line x1="300" y1="95" x2="350" y2="95" stroke="#333" marker-end="url(#a)" />
  <line x1="570" y1="95" x2="620" y2="95" stroke="#333" marker-end="url(#a)" />
  <rect x="80" y="170" width="220" height="50" fill="#f3f4f6" stroke="#6b7280" />
  <text x="190" y="200" text-anchor="middle" font-size="13" font-family="Arial">token and last_seq</text>
  <rect x="350" y="170" width="220" height="50" fill="#f3f4f6" stroke="#6b7280" />
  <text x="460" y="200" text-anchor="middle" font-size="13" font-family="Arial">ops_since or snapshot</text>
  <rect x="620" y="170" width="200" height="50" fill="#f3f4f6" stroke="#6b7280" />
  <text x="720" y="200" text-anchor="middle" font-size="13" font-family="Arial">resume polling</text>
  <line x1="190" y1="120" x2="190" y2="170" stroke="#333" marker-end="url(#a)" />
  <line x1="300" y1="195" x2="350" y2="195" stroke="#333" marker-end="url(#a)" />
  <line x1="570" y1="195" x2="620" y2="195" stroke="#333" marker-end="url(#a)" />
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>
</svg>
