<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <text x="450" y="35" text-anchor="middle" font-size="20" font-family="Arial">Concurrent edit example</text>
  <rect x="80" y="70" width="220" height="50" fill="#dbeafe" stroke="#2563eb" />
  <text x="190" y="100" text-anchor="middle" font-size="13" font-family="Arial">Client A sends edit</text>
  <rect x="600" y="70" width="220" height="50" fill="#dbeafe" stroke="#2563eb" />
  <text x="710" y="100" text-anchor="middle" font-size="13" font-family="Arial">Client B sends move</text>
  <rect x="340" y="170" width="220" height="50" fill="#dcfce7" stroke="#16a34a" />
  <text x="450" y="200" text-anchor="middle" font-size="13" font-family="Arial">Server locks room</text>
  <rect x="340" y="270" width="220" height="50" fill="#dcfce7" stroke="#16a34a" />
  <text x="450" y="300" text-anchor="middle" font-size="13" font-family="Arial">Seq 10 edit, Seq 11 move</text>
  <line x1="190" y1="120" x2="400" y2="170" stroke="#333" marker-end="url(#a)" />
  <line x1="710" y1="120" x2="500" y2="170" stroke="#333" marker-end="url(#a)" />
  <line x1="450" y1="220" x2="450" y2="270" stroke="#333" marker-end="url(#a)" />
  <text x="80" y="360" font-size="13" font-family="Arial">Both clients apply the two ops in seq order, so both boards match.</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>
</svg>
